name: Record CI LLM baseline

# Run by hand from the Actions tab or `gh workflow run`. It records the run that becomes
# baselines/ci-llm; promoting and committing it is a separate PR (see baselines/README.md).
on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: ./.github/actions/ci-llm-eval
        with:
          run-dir: runs/ci-llm
      - name: Report
        if: always()
        run: uv run deskrag report runs/ci-llm >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-llm-run
          path: runs/ci-llm
          if-no-files-found: error
